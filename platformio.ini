; PlatformIO Project Configuration File
;
; Beacon Opera4 and CW
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp01

[env:esp01]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = 
    etherkit/Etherkit Si5351@^2.1.4
build_flags = 
    -DESP8266

[env:esp01_ota]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_protocol = espota
upload_port = <IP_ADDRESS>  ; Replace with your ESP01 IP address
lib_deps = 
    etherkit/Etherkit Si5351@^2.1.4
build_flags = 
    -DESP8266

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = 
    etherkit/Etherkit Si5351@^2.1.4

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = 
    etherkit/Etherkit Si5351@^2.1.4

[env:nano_old_bootloader]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
upload_protocol = arduino
upload_speed = 57600
lib_deps = 
    etherkit/Etherkit Si5351@^2.1.4
